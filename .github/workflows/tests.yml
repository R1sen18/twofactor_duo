name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online:
        description: "Also call Duo's real API with fake credentials (--online)"
        type: boolean
        default: false

permissions:
  contents: read

# Actions are pinned to commit SHAs; tags can be moved to other code. The comment names the release.
jobs:
  test:
    name: PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: curl, mbstring
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: php tests/run.php ${{ inputs.online && '--online' || '' }}

  apache:
    name: Apache + Nextcloud .htaccess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .git, .github and tests are not served; the callback still works
        run: bash tests/apache/check.sh
