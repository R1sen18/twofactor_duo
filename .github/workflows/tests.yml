name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online:
        description: "Also call Duo's real API with fake credentials (--online)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: php tests/run.php ${{ inputs.online && '--online' || '' }}
